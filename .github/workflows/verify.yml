name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: python -m pip install --quiet requests numpy huggingface_hub
      - name: compile every stage
        run: python -m compileall -q pipeline trainfilter
      - name: fetch a sampled snapshot
        run: scripts/bootstrap.sh
      - name: rebuild and run the gates
        run: scripts/reproduce.sh
